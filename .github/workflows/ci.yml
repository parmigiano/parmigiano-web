name: CI
on:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    client_tests:
        name: Tests client release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Install dependencies
              run: CI=true pnpm install --frozen-lockfile

            - name: Lint code
              run: pnpm format

    client_build_release:
        name: Build client release
        runs-on: ubuntu-latest
        needs: [client_tests]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Install dependencies
              run: CI=true pnpm install --frozen-lockfile

            - name: Build project
              run: pnpm build

    deploy_prod:
        name: Deploy production
        runs-on: ubuntu-latest
        needs: [client_tests, client_build_release]
        if: github.ref == 'refs/heads/main'
        steps:
            - uses: actions/checkout@v3
            - name: SSH Deploy
              uses: appleboy/ssh-action@v0.1.10
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  password: ${{ secrets.VPS_PASSWORD }}
                  port: 22
                  script: |
                      set -e

                      cd parmigiano-web

                      git stash
                      git checkout main
                      git pull origin main

                      cd ./scripts

                      bash pre_deploy
                      bash systemd
                      bash setup_nginx
